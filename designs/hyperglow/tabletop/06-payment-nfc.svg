<svg width="800" height="1280" viewBox="0 0 800 1280" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="800" height="1280" fill="#FAFAF7"/>

  <!-- ===== Top app bar ===== -->
  <rect x="0" y="0" width="800" height="120" fill="#FFFFFF"/>
  <rect x="0" y="119" width="800" height="1" fill="#E5E3DA"/>
  <text x="32" y="40" font-size="12" font-weight="600" fill="#8A887E">19:51</text>
  <text x="768" y="40" text-anchor="end" font-size="12" fill="#8A887E">Secured by Stripe</text>
  <g transform="translate(32, 64)">
    <rect width="52" height="52" rx="14" fill="#FAFAF7" stroke="#E5E3DA"/>
    <g transform="translate(26, 26)" stroke="#1A1A17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="-8" y1="0" x2="8" y2="0"/>
      <polyline points="-2,-6 -8,0 -2,6"/>
    </g>
  </g>
  <text x="104" y="92" font-size="22" font-weight="700" fill="#1A1A17">Payment</text>
  <text x="104" y="114" font-size="13" fill="#8A887E">Step 2 of 2 · Choose how to pay</text>

  <!-- ===== Order summary collapsed ===== -->
  <g transform="translate(20, 140)">
    <rect width="760" height="100" rx="20" fill="#FFFFFF" stroke="#E5E3DA"/>
    <text x="24" y="36" font-size="13" font-weight="600" fill="#8A887E">YOUR ORDER · TABLE 7</text>
    <text x="24" y="76" font-size="22" font-weight="700" fill="#1A1A17">$56.58</text>
    <text x="24" y="94" font-size="12" fill="#8A887E">4 items · Subtotal $46.00 · Tax $3.68 · Tip $6.90</text>
    <g transform="translate(640, 38)">
      <rect width="96" height="44" rx="12" fill="#FAFAF7" stroke="#E5E3DA"/>
      <text x="48" y="28" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A17">View</text>
    </g>
  </g>

  <!-- ===== Payment method tabs ===== -->
  <text x="32" y="282" font-size="15" font-weight="700" fill="#1A1A17">Payment method</text>
  <g transform="translate(20, 296)">
    <g>
      <rect width="248" height="92" rx="18" fill="#1A1A17"/>
      <g transform="translate(28, 30)" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none">
        <path d="M0 16 a16 16 0 0 1 0 -32"/>
        <path d="M-6 12 a12 12 0 0 1 0 -24"/>
        <path d="M-12 8 a8 8 0 0 1 0 -16"/>
        <circle cx="-18" cy="0" r="2.5" fill="#FFFFFF"/>
      </g>
      <text x="64" y="42" font-size="14" font-weight="700" fill="#FFFFFF">NFC Tap</text>
      <text x="64" y="62" font-size="11" fill="#C9C7BD">Card or phone · Fastest</text>
      <g transform="translate(212, 16)">
        <rect width="28" height="20" rx="6" fill="#F26B3A"/>
        <text x="14" y="14" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">FAST</text>
      </g>
    </g>
    <g transform="translate(260, 0)">
      <rect width="248" height="92" rx="18" fill="#FFFFFF" stroke="#E5E3DA"/>
      <g transform="translate(28, 30)" stroke="#4D4B44" stroke-width="1.8" fill="none">
        <rect x="-14" y="-10" width="28" height="20" rx="4"/>
        <line x1="-14" y1="-2" x2="14" y2="-2"/>
        <line x1="-10" y1="5" x2="-4" y2="5"/>
      </g>
      <text x="64" y="42" font-size="14" font-weight="700" fill="#1A1A17">Card</text>
      <text x="64" y="62" font-size="11" fill="#8A887E">Visa · MC · Amex · Apple Pay</text>
    </g>
    <g transform="translate(520, 0)">
      <rect width="240" height="92" rx="18" fill="#FFFFFF" stroke="#E5E3DA"/>
      <g transform="translate(28, 30)" stroke="#4D4B44" stroke-width="1.8" fill="none">
        <circle cx="0" cy="0" r="12"/>
        <text x="0" y="4" text-anchor="middle" font-size="14" font-weight="700" fill="#4D4B44" stroke="none">$</text>
      </g>
      <text x="64" y="42" font-size="14" font-weight="700" fill="#1A1A17">Pay at table</text>
      <text x="64" y="62" font-size="11" fill="#8A887E">Cash · Server brings reader</text>
    </g>
  </g>

  <!-- ===== Main NFC tap area ===== -->
  <g transform="translate(20, 416)">
    <rect width="760" height="600" rx="32" fill="#FFFFFF" stroke="#E5E3DA"/>
    <g transform="translate(380, 250)">
      <circle r="220" fill="#FEE6DC" opacity="0.35"/>
      <circle r="170" fill="#FEE6DC" opacity="0.55"/>
      <circle r="120" fill="#FEE6DC"/>
      <g stroke="#F26B3A" stroke-width="4" stroke-linecap="round" fill="none">
        <path d="M0 60 a60 60 0 0 1 0 -120"/>
        <path d="M-20 44 a44 44 0 0 1 0 -88"/>
        <path d="M-40 28 a28 28 0 0 1 0 -56"/>
        <circle cx="-58" cy="0" r="6" fill="#F26B3A"/>
      </g>
    </g>
    <g transform="translate(380, 56)">
      <rect x="-110" y="0" width="220" height="36" rx="18" fill="#FEE6DC"/>
      <circle cx="-86" cy="18" r="5" fill="#F26B3A"/>
      <text x="-72" y="23" font-size="12" font-weight="700" fill="#D4502A" letter-spacing="1">WAITING FOR TAP…</text>
    </g>
    <text x="380" y="500" text-anchor="middle" font-size="28" font-weight="700" fill="#1A1A17">Tap your card or phone</text>
    <text x="380" y="530" text-anchor="middle" font-size="14" fill="#4D4B44">Hold your contactless card flat to this device</text>
    <text x="380" y="560" text-anchor="middle" font-size="12" fill="#8A887E">Apple Pay · Google Pay · Visa · Mastercard · Amex</text>
  </g>

  <!-- ===== Security row ===== -->
  <g transform="translate(20, 1036)">
    <rect width="760" height="68" rx="16" fill="#F2F1EC"/>
    <g transform="translate(28, 34)" stroke="#4D4B44" stroke-width="1.8" stroke-linecap="round" fill="none">
      <path d="M0 -10 L-10 -4 v6 c0 6 5 10 10 12 c5 -2 10 -6 10 -12 v-6 z"/>
      <polyline points="-4,0 -1,3 5,-4"/>
    </g>
    <text x="64" y="32" font-size="13" font-weight="700" fill="#1A1A17">End-to-end encrypted · PCI DSS Level 1</text>
    <text x="64" y="50" font-size="11" fill="#8A887E">Card details are never stored on the device. Powered by Stripe Terminal.</text>
  </g>

  <!-- ===== Sticky bottom bar ===== -->
  <rect x="0" y="1140" width="800" height="140" fill="#FFFFFF"/>
  <rect x="0" y="1140" width="800" height="1" fill="#E5E3DA"/>
  <g transform="translate(32, 1170)">
    <rect width="220" height="64" rx="20" fill="#FFFFFF" stroke="#E5E3DA"/>
    <text x="110" y="40" text-anchor="middle" font-size="15" font-weight="600" fill="#4D4B44">Cancel</text>
  </g>
  <text x="476" y="1198" font-size="12" fill="#8A887E">Total payable</text>
  <text x="476" y="1230" font-size="26" font-weight="700" fill="#1A1A17">$56.58</text>
  <g transform="translate(640, 1156)">
    <rect width="128" height="92" rx="20" fill="#1A1A17"/>
    <g transform="translate(64, 34)" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M0 14 a14 14 0 0 1 0 -28"/>
      <path d="M-6 10 a10 10 0 0 1 0 -20"/>
      <circle cx="-12" cy="0" r="2.5" fill="#FFFFFF"/>
    </g>
    <text x="64" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">TAP</text>
  </g>
</svg>
