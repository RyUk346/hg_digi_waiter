<svg width="800" height="1280" viewBox="0 0 800 1280" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="800" height="1280" fill="#FAFAF7"/>
  <path d="M0 0 H800 V440 Q400 540 0 440 Z" fill="#E8F3EE" opacity="0.55"/>
  <circle cx="80" cy="80" r="60" fill="#2D8A66" opacity="0.06"/>
  <circle cx="720" cy="380" r="100" fill="#F26B3A" opacity="0.06"/>

  <!-- Status bar -->
  <text x="32" y="40" font-size="12" font-weight="600" fill="#4D4B44">19:52</text>
  <text x="768" y="40" text-anchor="end" font-size="12" fill="#4D4B44">Wi-Fi · HG-Guest</text>

  <!-- Success mark -->
  <g transform="translate(400, 160)">
    <circle r="64" fill="#2D8A66" opacity="0.12"/>
    <circle r="46" fill="#2D8A66"/>
    <polyline points="-16,2 -4,14 18,-12" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-80" cy="-40" r="4" fill="#F26B3A"/>
    <circle cx="86" cy="-20" r="5" fill="#E8A33B"/>
    <circle cx="-100" cy="20" r="3" fill="#3B82C4"/>
    <circle cx="98" cy="36" r="4" fill="#2D8A66"/>
    <rect x="-70" y="-66" width="6" height="6" rx="1" fill="#F26B3A" transform="rotate(30 -67 -63)"/>
    <rect x="64" y="-56" width="6" height="6" rx="1" fill="#E8A33B" transform="rotate(-20 67 -53)"/>
  </g>

  <text x="400" y="280" text-anchor="middle" font-size="32" font-weight="700" fill="#1A1A17">Order confirmed!</text>
  <text x="400" y="310" text-anchor="middle" font-size="14" fill="#4D4B44">Paid · $56.58 · 19:52</text>

  <!-- ===== Token card ===== -->
  <g transform="translate(80, 360)">
    <rect width="640" height="220" rx="28" fill="#FFFFFF" stroke="#E5E3DA"/>
    <text x="320" y="50" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="3" fill="#8A887E">YOUR ORDER TOKEN</text>
    <line x1="40" y1="68" x2="600" y2="68" stroke="#E5E3DA" stroke-dasharray="4,6"/>
    <text x="320" y="158" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="86" font-weight="700" fill="#1A1A17" letter-spacing="6">#A047</text>
    <text x="320" y="194" text-anchor="middle" font-size="13" fill="#8A887E">Keep this device active to track your order</text>
  </g>

  <!-- ===== Status pills row ===== -->
  <g transform="translate(80, 620)">
    <text font-size="14" font-weight="700" fill="#1A1A17">Order status</text>
    <text x="640" text-anchor="end" font-size="12" fill="#8A887E">Updates live</text>
    <g transform="translate(0, 20)">
      <g>
        <rect width="200" height="60" rx="16" fill="#E1ECF6" stroke="#3B82C4" stroke-width="2"/>
        <circle cx="24" cy="30" r="9" fill="#3B82C4"/>
        <polyline points="20,30 23,33 28,27" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="42" y="28" font-size="13" font-weight="700" fill="#3B82C4">Accepted</text>
        <text x="42" y="44" font-size="11" fill="#3B82C4">Just now</text>
      </g>
      <g transform="translate(220, 0)">
        <rect width="200" height="60" rx="16" fill="#FFFFFF" stroke="#E5E3DA"/>
        <circle cx="24" cy="30" r="9" fill="none" stroke="#C9C7BD" stroke-width="2"/>
        <text x="42" y="28" font-size="13" font-weight="700" fill="#8A887E">Preparing</text>
        <text x="42" y="44" font-size="11" fill="#8A887E">Up next</text>
      </g>
      <g transform="translate(440, 0)">
        <rect width="200" height="60" rx="16" fill="#FFFFFF" stroke="#E5E3DA"/>
        <circle cx="24" cy="30" r="9" fill="none" stroke="#C9C7BD" stroke-width="2"/>
        <text x="42" y="28" font-size="13" font-weight="700" fill="#8A887E">Ready</text>
        <text x="42" y="44" font-size="11" fill="#8A887E">Awaiting kitchen</text>
      </g>
    </g>
  </g>

  <!-- ===== ETA card ===== -->
  <g transform="translate(80, 736)">
    <rect width="310" height="80" rx="20" fill="#FFFFFF" stroke="#E5E3DA"/>
    <g transform="translate(28, 40)" stroke="#F26B3A" stroke-width="2" stroke-linecap="round" fill="none">
      <circle r="14"/>
      <polyline points="0,-8 0,0 6,5"/>
    </g>
    <text x="60" y="38" font-size="12" fill="#8A887E">Estimated time</text>
    <text x="60" y="62" font-size="20" font-weight="700" fill="#1A1A17">~15 minutes</text>
  </g>
  <g transform="translate(410, 736)">
    <rect width="310" height="80" rx="20" fill="#FFFFFF" stroke="#E5E3DA"/>
    <g transform="translate(28, 40)" stroke="#2D8A66" stroke-width="2" stroke-linecap="round" fill="none">
      <circle cx="0" cy="-4" r="6"/>
      <path d="M-10 12 a10 10 0 0 1 20 0"/>
    </g>
    <text x="60" y="38" font-size="12" fill="#8A887E">Server</text>
    <text x="60" y="62" font-size="20" font-weight="700" fill="#1A1A17">Brought to Table 7</text>
  </g>

  <!-- ===== Mini summary list ===== -->
  <g transform="translate(80, 848)">
    <rect width="640" height="170" rx="20" fill="#FFFFFF" stroke="#E5E3DA"/>
    <text x="24" y="36" font-size="14" font-weight="700" fill="#1A1A17">Summary · 4 items</text>
    <line x1="24" y1="50" x2="616" y2="50" stroke="#F2F1EC"/>
    <g transform="translate(24, 76)">
      <text font-size="13" fill="#1A1A17">2× Glow Smash Burger</text>
      <text x="592" text-anchor="end" font-size="13" font-weight="600" fill="#1A1A17">$32.00</text>
      <text y="22" font-size="11" fill="#8A887E">Regular · +cheese +bacon · no pickle · 🌶 Medium</text>
    </g>
    <g transform="translate(24, 124)">
      <text font-size="13" fill="#1A1A17">1× Iced Honey Latte</text>
      <text x="592" text-anchor="end" font-size="13" font-weight="600" fill="#1A1A17">$6.80</text>
    </g>
    <g transform="translate(24, 148)">
      <text font-size="13" fill="#1A1A17">1× Vanilla Bean Scoop</text>
      <text x="592" text-anchor="end" font-size="13" font-weight="600" fill="#1A1A17">$7.20</text>
    </g>
  </g>

  <!-- ===== Action buttons ===== -->
  <g transform="translate(80, 1054)">
    <rect width="640" height="64" rx="20" fill="#F26B3A"/>
    <text x="320" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Track live order  →</text>
  </g>
  <g transform="translate(80, 1132)">
    <rect width="640" height="56" rx="18" fill="none" stroke="#E5E3DA" stroke-width="1.5"/>
    <text x="320" y="35" text-anchor="middle" font-size="14" font-weight="600" fill="#4D4B44">Order more items</text>
  </g>

  <text x="400" y="1240" text-anchor="middle" font-size="11" fill="#8A887E">A receipt has been queued for printing</text>
</svg>
