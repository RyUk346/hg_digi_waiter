  <rect x="0" y="1140" width="800" height="1" fill="#E5E3DA"/>
  <text x="32" y="1180" font-size="12" fill="#8A887E">Total · 4 items · Table 7</text>
  <text x="32" y="1212" font-size="26" font-weight="700" fill="#1A1A17">$56.58</text>
  <g transform="translate(420, 1170)">
