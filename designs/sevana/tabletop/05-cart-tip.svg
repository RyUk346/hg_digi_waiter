      <text x="69" y="26" text-anchor="middle" font-family="Geist, sans-serif" font-size="14" font-weight="500" fill="#3A322C">20%</text>
      <text x="69" y="46" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="500" fill="#1F1A17">$9.20</text>
