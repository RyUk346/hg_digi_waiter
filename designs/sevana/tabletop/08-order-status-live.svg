<svg width="800" height="1280" viewBox="0 0 800 1280" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="1280" fill="#FBF8F2"/>

  <!-- ===== Top bar ===== -->
  <rect x="0" y="0" width="800" height="124" fill="#FBF8F2"/>
  <line x1="0" y1="124" x2="800" y2="124" stroke="#E5DCCC"/>
  <g font-family="Geist Mono, monospace" font-size="11" fill="#3A322C" letter-spacing="0.5">
    <text x="24" y="28">20:01</text>
    <text x="776" y="28" text-anchor="end">WI-FI · 96%</text>
  </g>
  <g transform="translate(24, 56)">
    <text font-family="Geist Mono, monospace" font-size="10" letter-spacing="2" fill="#C5572D">LIVE ORDER · UPDATED 20:01</text>
    <text y="40" font-family="Fraunces, Georgia, serif" font-size="22" font-weight="500" fill="#1F1A17">Order <tspan font-style="italic" fill="#C5572D">#A047</tspan></text>
    <text y="62" font-family="Geist Mono, monospace" font-size="11" letter-spacing="1.5" fill="#6B5F55">TABLE 07 · PLACED 9 MIN AGO</text>
  </g>
  <!-- Live badge -->
  <g transform="translate(636, 56)">
    <rect width="140" height="44" rx="22" fill="#D7E1D2"/>
    <circle cx="24" cy="22" r="6" fill="#3D5A3D"/>
    <circle cx="24" cy="22" r="11" fill="#3D5A3D" opacity="0.25"/>
    <text x="44" y="27" font-family="Geist Mono, monospace" font-size="10" letter-spacing="2" fill="#3D5A3D">LIVE STATUS</text>
  </g>

  <!-- ===== Hero progress card ===== -->
  <g transform="translate(24, 148)">
    <rect width="752" height="320" rx="24" fill="#FBF8F2" stroke="#E5DCCC"/>
    <rect width="752" height="6" rx="3" fill="#D69537"/>
    <text x="40" y="58" font-family="Geist Mono, monospace" font-size="11" letter-spacing="3" fill="#6B5F55">CURRENT STAGE</text>
    <text x="40" y="108" font-family="Fraunces, Georgia, serif" font-size="40" font-weight="500" letter-spacing="-1" fill="#D69537">Preparing <tspan font-style="italic" fill="#1F1A17">your order</tspan></text>
    <text x="40" y="132" font-family="Geist, sans-serif" font-size="13" fill="#6B5F55">Chef <tspan font-weight="600" fill="#1F1A17">Khalid</tspan> started cooking at 19:58 · Est. ready in ~6 min</text>

    <!-- Progress rail -->
    <g transform="translate(80, 200)">
      <line x1="0" y1="40" x2="600" y2="40" stroke="#E5DCCC" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="40" x2="300" y2="40" stroke="#D69537" stroke-width="6" stroke-linecap="round"/>
      <!-- Accepted ✓ -->
      <g transform="translate(0, 40)">
        <circle r="22" fill="#3D5A3D"/>
        <polyline points="-9,1 -3,7 9,-6" fill="none" stroke="#FBF8F2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text y="50" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="14" font-weight="500" fill="#1F1A17">Accepted</text>
        <text y="68" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" letter-spacing="1.5" fill="#3D5A3D">19:52</text>
      </g>
      <!-- Preparing (current) -->
      <g transform="translate(300, 40)">
        <circle r="28" fill="#D69537" opacity="0.25"/>
        <circle r="22" fill="#D69537"/>
        <g stroke="#FBF8F2" stroke-width="2.5" stroke-linecap="round" fill="none">
          <path d="M-7 -2 v -3 a 7 7 0 0 1 14 0 v 3"/>
          <rect x="-9" y="-2" width="18" height="10" rx="2"/>
        </g>
        <text y="50" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="14" font-weight="500" fill="#D69537">Preparing</text>
        <text y="68" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" letter-spacing="1.5" fill="#D69537">IN PROGRESS</text>
      </g>
      <!-- Ready (pending) -->
      <g transform="translate(600, 40)">
        <circle r="22" fill="#FBF8F2" stroke="#D9CFBE" stroke-width="2"/>
        <g stroke="#D9CFBE" stroke-width="2" stroke-linecap="round" fill="none">
          <circle r="5"/>
          <path d="M-4 0 a 4 4 0 0 1 8 0"/>
        </g>
        <text y="50" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="14" font-weight="500" fill="#6B5F55">Ready</text>
        <text y="68" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" letter-spacing="1.5" fill="#A29687">~ 6 MIN</text>
      </g>
    </g>
  </g>

  <!-- ===== Per-item station rows ===== -->
  <text x="24" y="510" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="500" fill="#1F1A17">Items in your <tspan font-style="italic" fill="#C5572D">order</tspan></text>
  <text x="776" y="510" text-anchor="end" font-family="Geist Mono, monospace" font-size="10" letter-spacing="2" fill="#6B5F55">TRACKED BY STATION</text>

  <!-- Item 1: Burgers preparing -->
  <g transform="translate(24, 526)">
    <rect width="752" height="98" rx="14" fill="#FBF8F2" stroke="#E5DCCC"/>
    <rect x="16" y="16" width="66" height="66" rx="11" fill="#F5EFE6"/>
    <g transform="translate(49, 49)">
      <ellipse cx="0" cy="10" rx="22" ry="3" fill="#9F3F1C"/>
      <path d="M-22 0 a 22 12 0 0 1 44 0 Z" fill="#D69537"/>
      <rect x="-22" y="-1" width="44" height="3" fill="#3D5A3D"/>
    </g>
    <text x="100" y="34" font-family="Fraunces, Georgia, serif" font-size="16" font-weight="500" fill="#1F1A17">2× Glow Smash<tspan font-style="italic" fill="#C5572D"> Burger</tspan></text>
    <text x="100" y="54" font-family="Geist Mono, monospace" font-size="10" letter-spacing="1.5" fill="#6B5F55">MAIN KITCHEN · CHEF KHALID</text>
    <text x="100" y="76" font-family="Geist, sans-serif" font-size="12" fill="#D69537">🔥 On the grill · 3 min remaining</text>
    <g transform="translate(622, 30)">
      <rect width="116" height="36" rx="18" fill="#FFF3DC" stroke="#D69537"/>
      <circle cx="20" cy="18" r="4" fill="#D69537"/>
      <text x="32" y="22" font-family="Geist Mono, monospace" font-size="10" letter-spacing="1.5" fill="#9F6F10">PREPARING</text>
    </g>
  </g>

  <!-- Item 2: Latte ready -->
  <g transform="translate(24, 638)">
    <rect width="752" height="98" rx="14" fill="#FBF8F2" stroke="#E5DCCC"/>
    <rect x="16" y="16" width="66" height="66" rx="11" fill="#D7E1D2"/>
    <g transform="translate(49, 49)">
      <path d="M-12 -8 H14 L12 12 Q12 16 9 16 H-9 Q-12 16 -12 12 Z" fill="#FBF8F2" stroke="#3A322C" stroke-width="1.2"/>
      <ellipse cx="1" cy="-8" rx="13" ry="2" fill="#9F3F1C"/>
    </g>
    <text x="100" y="34" font-family="Fraunces, Georgia, serif" font-size="16" font-weight="500" fill="#1F1A17">1× Iced Honey<tspan font-style="italic" fill="#C5572D"> Latte</tspan></text>
    <text x="100" y="54" font-family="Geist Mono, monospace" font-size="10" letter-spacing="1.5" fill="#6B5F55">BAR STATION · BARISTA RIYA</text>
    <text x="100" y="76" font-family="Geist, sans-serif" font-size="12" fill="#3D5A3D">✓ Ready · Will arrive together with burgers</text>
    <g transform="translate(636, 30)">
      <rect width="102" height="36" rx="18" fill="#D7E1D2" stroke="#3D5A3D"/>
      <circle cx="20" cy="18" r="4" fill="#3D5A3D"/>
      <text x="32" y="22" font-family="Geist Mono, monospace" font-size="10" letter-spacing="1.5" fill="#3D5A3D">READY</text>
    </g>
  </g>

  <!-- Item 3: Scoop queued -->
  <g transform="translate(24, 750)">
    <rect width="752" height="98" rx="14" fill="#FBF8F2" stroke="#E5DCCC"/>
    <rect x="16" y="16" width="66" height="66" rx="11" fill="#F5EFE6"/>
    <g transform="translate(49, 49)">
      <path d="M-14 4 L 0 22 L 14 4 Z" fill="#F4D5A8" stroke="#B58836" stroke-width="1.2"/>
      <circle cx="0" cy="-2" r="14" fill="#FBF8F2"/>
    </g>
    <text x="100" y="34" font-family="Fraunces, Georgia, serif" font-size="16" font-weight="500" fill="#1F1A17">1× Vanilla Bean<tspan font-style="italic" fill="#C5572D"> Scoop</tspan></text>
    <text x="100" y="54" font-family="Geist Mono, monospace" font-size="10" letter-spacing="1.5" fill="#6B5F55">ICE CREAM VENDOR · SENT ACROSS HALLWAY</text>
    <text x="100" y="76" font-family="Geist, sans-serif" font-size="12" fill="#3D5A3D">⏱ Queued · Starts when burger is plated</text>
    <g transform="translate(622, 30)">
      <rect width="116" height="36" rx="18" fill="#F5EFE6" stroke="#3D5A3D"/>
      <circle cx="20" cy="18" r="4" fill="#3D5A3D"/>
      <text x="32" y="22" font-family="Geist Mono, monospace" font-size="10" letter-spacing="1.5" fill="#3D5A3D">QUEUED</text>
    </g>
  </g>

  <!-- ===== Call server card ===== -->
  <g transform="translate(24, 868)">
    <rect width="752" height="92" rx="14" fill="#FBF8F2" stroke="#E5DCCC"/>
    <g transform="translate(56, 48)" stroke="#C5572D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M-12 -6 a 12 12 0 1 1 24 0 v 6 l 4 6 H -16 l 4 -6 z"/>
      <path d="M-4 8 a 4 4 0 0 0 8 0"/>
    </g>
    <text x="100" y="40" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="500" fill="#1F1A17">Need <tspan font-style="italic" fill="#C5572D">anything</tspan>?</text>
    <text x="100" y="62" font-family="Geist, sans-serif" font-size="12" fill="#6B5F55">Ask for water, cutlery, condiments — or a quick chat with your server.</text>
    <g transform="translate(564, 28)">
      <rect width="172" height="40" rx="14" fill="#C5572D"/>
      <text x="86" y="26" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="14" font-weight="500" fill="#FBF8F2">Call <tspan font-style="italic" fill="#F0D8C9">server</tspan></text>
    </g>
  </g>

  <!-- ===== Token strip (dark, mono numerals) ===== -->
  <g transform="translate(24, 982)">
    <rect width="752" height="84" rx="14" fill="#1F1A17"/>
    <text x="24" y="32" font-family="Geist Mono, monospace" font-size="10" letter-spacing="2.4" fill="#A29687">TOKEN</text>
    <text x="24" y="64" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="500" fill="#FBF8F2"><tspan font-style="italic" fill="#F0D8C9">#</tspan>A047</text>
    <line x1="160" y1="20" x2="160" y2="68" stroke="#3D362F"/>
    <text x="180" y="32" font-family="Geist Mono, monospace" font-size="10" letter-spacing="2.4" fill="#A29687">TABLE</text>
    <text x="180" y="64" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="500" fill="#FBF8F2">07</text>
    <line x1="288" y1="20" x2="288" y2="68" stroke="#3D362F"/>
    <text x="308" y="32" font-family="Geist Mono, monospace" font-size="10" letter-spacing="2.4" fill="#A29687">TOTAL</text>
    <text x="308" y="64" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="500" fill="#FBF8F2">$56.58</text>
    <line x1="492" y1="20" x2="492" y2="68" stroke="#3D362F"/>
    <text x="512" y="32" font-family="Geist Mono, monospace" font-size="10" letter-spacing="2.4" fill="#A29687">SERVED BY</text>
    <text x="512" y="64" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="22" font-weight="500" fill="#FBF8F2">Chen L.</text>
  </g>

  <!-- ===== Sticky bar ===== -->
  <rect x="0" y="1124" width="800" height="156" fill="#FBF8F2"/>
  <line x1="0" y1="1124" x2="800" y2="1124" stroke="#E5DCCC"/>
  <g transform="translate(24, 1158)">
    <rect width="360" height="68" rx="14" fill="#FBF8F2" stroke="#E5DCCC" stroke-width="1.5"/>
    <text x="180" y="42" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="15" font-weight="500" fill="#3A322C">Browse <tspan font-style="italic" fill="#C5572D">menu</tspan></text>
  </g>
  <g transform="translate(408, 1158)">
    <rect width="368" height="68" rx="14" fill="#1F1A17"/>
    <text x="184" y="42" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="15" font-weight="500" fill="#FBF8F2">View full <tspan font-style="italic" fill="#F0D8C9">receipt</tspan></text>
  </g>
</svg>
